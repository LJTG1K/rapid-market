<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAPID Pixel Events</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --wash: rgba(11, 11, 11, 0.05);
    --series-buy: #2a78d6;
    --series-quiz: #eb6834;
    --good: #0ca30c;
    --warn: #fab219;
    --crit: #d03b3b;
    --crit-text: #b02a2a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --wash: rgba(255, 255, 255, 0.06);
      --series-buy: #3987e5;
      --series-quiz: #d95926;
      --crit-text: #ec6a6a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 24px 20px 64px; }
  header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0 0 2px; }
  .sub { color: var(--ink-2); margin: 0; max-width: 62ch; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .controls button, .controls label { font: inherit; }
  button.seg {
    background: var(--surface); color: var(--ink); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 6px; cursor: pointer;
  }
  button.seg:hover { background: var(--wash); }
  button.seg[aria-pressed="true"] { border-color: var(--ink); font-weight: 600; }
  .auto { color: var(--ink-2); display: flex; align-items: center; gap: 6px; margin-left: 4px; }
  #updated { color: var(--muted); font-size: 12px; }

  .banner { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; color: var(--ink-2); }
  .banner.err { border-color: var(--crit); color: var(--ink); }
  .banner strong { color: var(--ink); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
  .tile .label { color: var(--ink-2); font-size: 13px; }
  .tile .value { font-size: 30px; font-weight: 600; line-height: 1.2; margin: 2px 0; }
  .tile .note { color: var(--muted); font-size: 12px; }
  .tile .note.crit { color: var(--crit-text); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; margin-bottom: 20px; }
  .card h2 { font-size: 16px; margin: 0 0 2px; }
  .card h3 { font-size: 13px; margin: 18px 0 2px; }
  .card .hint { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 12px 24px; }
  .chart-title { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 4px; }
  .key { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .tip {
    position: absolute; pointer-events: none; background: var(--surface); color: var(--ink);
    border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,.15); border-radius: 6px;
    padding: 6px 9px; font-size: 12px; white-space: nowrap; z-index: 5; display: none;
  }
  .tip .t { color: var(--ink-2); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--ink-2); font-weight: 500; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--baseline); white-space: nowrap; }
  td { padding: 6px 10px 6px 0; border-bottom: 1px solid var(--grid); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { font-variant-numeric: tabular-nums; text-align: right; padding-right: 16px; }
  .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; font-variant-ligatures: none; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 8px 32px; }
  .crit { color: var(--crit-text); font-weight: 600; }
  .barcell { display: flex; align-items: center; gap: 8px; }
  .bar { height: 8px; border-radius: 0 4px 4px 0; min-width: 2px; }
  .st { display: inline-block; width: 1.1em; text-align: center; font-weight: 700; }
  .st-good { color: var(--good); }
  .st-warn { color: #c98500; }
  .st-crit { color: var(--crit); }
  .st-none { color: var(--muted); }
  .fire { white-space: nowrap; }
  .fire + .fire { margin-top: 2px; }
  details { margin-top: 14px; }
  summary { cursor: pointer; color: var(--ink-2); }
  .empty { color: var(--muted); padding: 8px 0; }
  @media (max-width: 560px) { .charts, .cols { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Pixel events</h1>
      <p class="sub">Meta and Reddit fires for Sugargoo buy clicks and quiz completions, from the Supabase ledger. <strong>Browser</strong> is what the visitor's pixel reported; <strong>Server</strong> is what our Conversions API call returned.</p>
    </div>
    <div class="controls">
      <span id="windows"></span>
      <button class="seg" id="refresh">Refresh</button>
      <label class="auto"><input type="checkbox" id="bf" checked> backfilled history</label>
      <label class="auto"><input type="checkbox" id="auto"> auto (60s)</label>
      <span id="updated"></span>
    </div>
  </header>
  <div id="banners"></div>
  <div id="app"></div>
</div>
<div class="tip" id="tip"></div>

<script>
const WINDOWS = [{ label: '24 hours', hours: 24 }, { label: '7 days', hours: 168 }, { label: '30 days', hours: 720 }];
const LOGICAL = {
  buy_click: { title: 'Sugargoo buy clicks', noun: 'buy click', color: 'var(--series-buy)' },
  quiz_complete: { title: 'Quiz completions', noun: 'quiz completion', color: 'var(--series-quiz)' },
};
const STATUS = {
  sent: ['✓', 'good'], success: ['✓', 'good'],
  queued: ['…', 'warn'], skipped: ['–', 'none'],
  missing: ['✕', 'crit'], error: ['✕', 'crit'],
};
let hours = 24, data = null, timer = null, includeBackfill = true;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => Number(n).toLocaleString();
const pct = (n, d) => (d ? Math.round((n / d) * 100) + '%' : '—');

function renderWindows() {
  $('#windows').innerHTML = WINDOWS.map((w) =>
    `<button class="seg" data-h="${w.hours}" aria-pressed="${w.hours === hours}">${w.label}</button>`).join(' ');
  document.querySelectorAll('#windows button').forEach((b) => b.addEventListener('click', () => { hours = Number(b.dataset.h); renderWindows(); load(); }));
}

async function load() {
  $('#refresh').textContent = 'Loading…';
  try {
    const res = await fetch('/api/summary?hours=' + hours);
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || 'Failed to load');
    data = body;
    $('#banners').innerHTML = (data.demo ? '<div class="banner"><strong>Demo data.</strong> These numbers are generated, not from your ledger. Run <span class="mono">npm run dashboard</span> without <span class="mono">--demo</span> for the real thing.</div>' : '') +
      (data.truncated ? `<div class="banner">More rows than the dashboard reads at once — showing the newest ${fmt(data.totalRows)}. Pick a shorter window.</div>` : '');
    render();
    $('#updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    $('#banners').innerHTML = `<div class="banner err"><strong>Couldn't load the ledger.</strong> ${esc(e.message)}</div>`;
    $('#app').innerHTML = '';
  } finally {
    $('#refresh').textContent = 'Refresh';
  }
}

function statusHtml(status) {
  const [glyph, tone] = STATUS[status] || ['?', 'none'];
  return `<span class="st st-${tone}" aria-hidden="true">${glyph}</span>${esc(status)}`;
}

/* ---------- summary tiles ---------- */
function deliveryTile(platform, label) {
  let sent = 0, total = 0, queued = 0;
  for (const e of data.events) {
    if (e.platform !== platform) continue;
    sent += e.browser.sent; queued += e.browser.queued;
    total += e.browser.sent + e.browser.queued + e.browser.missing + e.browser.error;
  }
  const note = total ? `${fmt(queued)} queued (likely blocked) of ${fmt(total)}` : 'no browser reports yet';
  return `<div class="tile"><div class="label">${label} pixel delivery</div><div class="value">${pct(sent, total)}</div><div class="note">${note}</div></div>`;
}

function countTile(k, label, plain) {
  const live = data.actions.filter((a) => a.logicalEvent === k && !a.backfill).length;
  const bf = includeBackfill ? data.actions.filter((a) => a.logicalEvent === k && a.backfill).length : 0;
  const note = bf ? `${fmt(live)} tracked · ${fmt(bf)} backfilled` : plain;
  return `<div class="tile"><div class="label">${label}</div><div class="value">${fmt(live + bf)}</div><div class="note">${note}</div></div>`;
}

function tiles() {
  let errors = 0;
  for (const e of data.events) errors += e.server.error;
  return `<div class="tiles">
    ${countTile('buy_click', 'Buy clicks', 'distinct clicks out to Sugargoo')}
    ${countTile('quiz_complete', 'Quiz completions', 'distinct completions')}
    ${deliveryTile('meta', 'Meta')}
    ${deliveryTile('reddit', 'Reddit')}
    <div class="tile"><div class="label">Server errors</div><div class="value">${fmt(errors)}</div>
      <div class="note ${errors ? 'crit' : ''}">${errors ? '✕ Conversions API calls that failed' : '✓ none'}</div></div>
  </div>`;
}

/* ---------- timeline ---------- */
function buckets() {
  const hourly = hours <= 48;
  const start = new Date(Date.now() - hours * 3600_000);
  hourly ? start.setMinutes(0, 0, 0) : start.setHours(0, 0, 0, 0);
  const list = [];
  for (let d = new Date(start); d <= new Date(); hourly ? d.setHours(d.getHours() + 1) : d.setDate(d.getDate() + 1)) {
    list.push({ t: d.getTime(), buy_click: 0, quiz_complete: 0, buy_click_bf: 0, quiz_complete_bf: 0 });
  }
  const index = new Map(list.map((b, i) => [b.t, i]));
  for (const a of data.actions) {
    if (a.backfill && !includeBackfill) continue;
    const d = new Date(a.t);
    hourly ? d.setMinutes(0, 0, 0) : d.setHours(0, 0, 0, 0);
    const i = index.get(d.getTime());
    if (i !== undefined) list[i][a.logicalEvent + (a.backfill ? '_bf' : '')] += 1;
  }
  return { list, hourly };
}

function bucketLabel(t, hourly, long) {
  const d = new Date(t);
  return hourly
    ? d.toLocaleString([], long ? { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric' } : { weekday: 'short', hour: 'numeric' })
    : d.toLocaleDateString([], long ? { weekday: 'short', month: 'short', day: 'numeric' } : { month: 'short', day: 'numeric' });
}

function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(Math.max(raw, 1))));
  for (const m of [1, 2, 5, 10]) if (m * p >= raw) return Math.max(1, m * p);
  return 10 * p;
}

function chart(key, list, hourly) {
  const cfg = LOGICAL[key];
  const W = 560, H = 190, m = { l: 36, r: 6, t: 8, b: 24 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const max = Math.max(...list.map((b) => b[key] + b[key + '_bf']), 0);
  const step = niceStep(max / 4 || 1);
  const top = Math.max(step * Math.ceil(max / step), step);
  const y = (v) => m.t + ph - (v / top) * ph;
  const slot = pw / list.length;
  const bw = Math.max(2, Math.min(24, slot - 2));

  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(cfg.title)} over time">`;
  for (let v = 0; v <= top; v += step) {
    svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? 'var(--baseline)' : 'var(--grid)'}" stroke-width="1"/>`;
    svg += `<text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" style="font-variant-numeric:tabular-nums">${fmt(v)}</text>`;
  }
  const every = Math.ceil(list.length / Math.max(2, Math.floor(pw / 90)));
  list.forEach((b, i) => {
    const cx = m.l + slot * i + slot / 2;
    if (i % every === 0) svg += `<text x="${cx}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(bucketLabel(b.t, hourly, false))}</text>`;
    // Backfilled history sits at the bottom in a lighter tint; tracked actions stack on top,
    // separated by a 2px surface gap. Only the topmost segment gets the rounded end.
    const real = b[key], bf = b[key + '_bf'], x = cx - bw / 2, base = y(0);
    const bar = (top, bottom, round, opacity) => {
      const h = bottom - top;
      if (h <= 0) return '';
      const r = round ? Math.min(4, bw / 2, h) : 0;
      const cap = r ? `V${top + r} Q${x},${top} ${x + r},${top} H${x + bw - r} Q${x + bw},${top} ${x + bw},${top + r}` : `V${top} H${x + bw}`;
      return `<path d="M${x},${bottom} ${cap} V${bottom} Z" fill="${cfg.color}" fill-opacity="${opacity}"/>`;
    };
    if (bf > 0) svg += bar(y(bf), base, real === 0, 0.4);
    if (real > 0) svg += bar(y(bf + real), bf > 0 ? Math.max(y(bf) - 2, y(bf + real) + 1) : base, true, 1);
    svg += `<rect class="hit" data-i="${i}" x="${m.l + slot * i}" y="${m.t}" width="${slot}" height="${ph}" fill="transparent"/>`;
  });
  svg += '</svg>';

  return `<div><div class="chart-title"><span class="key" style="background:${cfg.color}"></span>${esc(cfg.title)}</div>
    <div class="chart" data-key="${key}">${svg}</div></div>`;
}

function wireTooltips(list, hourly) {
  const tip = $('#tip');
  document.querySelectorAll('.chart').forEach((el) => {
    const key = el.dataset.key;
    el.querySelectorAll('.hit').forEach((r) => {
      r.addEventListener('mousemove', (ev) => {
        const b = list[Number(r.dataset.i)];
        const bf = b[key + '_bf'], total = b[key] + bf;
        tip.innerHTML = `<div class="t">${esc(bucketLabel(b.t, hourly, true))}</div><strong>${fmt(total)}</strong> ${LOGICAL[key].noun}${total === 1 ? '' : 's'}` +
          (bf ? `<div class="t">${fmt(b[key])} tracked · ${fmt(bf)} backfilled</div>` : '');
        tip.style.display = 'block';
        tip.style.left = ev.pageX + 12 + 'px';
        tip.style.top = ev.pageY + 12 + 'px';
        r.setAttribute('fill', 'var(--wash)');
      });
      r.addEventListener('mouseleave', () => { tip.style.display = 'none'; r.setAttribute('fill', 'transparent'); });
    });
  });
}

/* ---------- per-action sections ---------- */
function eventTable(k) {
  const rows = data.events.filter((e) => e.logicalEvent === k);
  return `<table><thead><tr><th>Platform event</th>
      <th class="num">Browser sent</th><th class="num">queued</th><th class="num">missing</th>
      <th class="num">Server ok</th><th class="num">error</th><th class="num">skipped</th></tr></thead><tbody>` +
    rows.map((e) => `<tr><td>${esc(e.platform)} · ${esc(e.platformEvent)}</td>
      <td class="num">${fmt(e.browser.sent)}</td>
      <td class="num">${fmt(e.browser.queued)}</td>
      <td class="num ${e.browser.missing ? 'crit' : ''}">${e.browser.missing ? '✕ ' : ''}${fmt(e.browser.missing)}</td>
      <td class="num">${fmt(e.server.success)}</td>
      <td class="num ${e.server.error ? 'crit' : ''}">${e.server.error ? '✕ ' : ''}${fmt(e.server.error)}</td>
      <td class="num">${fmt(e.server.skipped)}</td></tr>`).join('') + '</tbody></table>';
}

function pageTable(k) {
  const rows = data.byPage.filter((p) => p.logicalEvent === k);
  const cell = (n, total) => n < total ? `<td class="num crit" title="${total - n} action(s) with no browser fire to this platform">✕ ${fmt(n)}</td>` : `<td class="num">${fmt(n)}</td>`;
  return `<table><thead><tr><th>Page</th><th class="num">Actions</th><th class="num">Meta</th><th class="num">Reddit</th></tr></thead><tbody>` +
    rows.map((p) => `<tr><td class="mono">${esc(p.page)}</td><td class="num">${fmt(p.actions)}</td>${cell(p.meta, p.actions)}${cell(p.reddit, p.actions)}</tr>`).join('') + '</tbody></table>';
}

function channelTable(k) {
  const rows = data.byChannel.filter((c) => c.logicalEvent === k);
  const max = Math.max(...rows.map((r) => r.actions), 1);
  return `<table><thead><tr><th>Channel</th><th>Actions</th></tr></thead><tbody>` +
    rows.map((c) => `<tr><td>${esc(c.channel)}</td><td><div class="barcell"><span class="bar" style="width:${Math.round((c.actions / max) * 140)}px;background:${LOGICAL[k].color}"></span>${fmt(c.actions)}</div></td></tr>`).join('') + '</tbody></table>';
}

function actionSection(k) {
  if (!data.events.some((e) => e.logicalEvent === k)) return '';
  return `<section class="card"><h2>${esc(LOGICAL[k].title)}</h2>
    <p class="hint">What each platform received, per platform event. "queued" is a pixel that was on the page but hadn't loaded its library — usually an ad blocker.</p>
    ${eventTable(k)}
    <div class="cols">
      <div><h3>By page</h3><p class="hint">Actions, and how many the browser fired to each platform. Meta and Reddit should match the action count.</p>${pageTable(k)}</div>
      <div><h3>By channel</h3><p class="hint">From the visitor's stored UTM / landing-page attribution.</p>${channelTable(k)}</div>
    </div></section>`;
}

/* ---------- recent activity ---------- */
function recentTable() {
  if (!data.recentActions.length) return '<div class="empty">Nothing in this window.</div>';
  return `<table><thead><tr><th>When</th><th>Action</th><th>Page</th><th>Channel</th><th>Fires</th></tr></thead><tbody>` +
    data.recentActions.map((a) => {
      const byEvent = new Map();
      for (const f of a.fires) {
        const key = f.platform + '|' + f.platformEvent;
        if (!byEvent.has(key)) byEvent.set(key, { platform: f.platform, name: f.platformEvent });
        byEvent.get(key)[f.source] = f;
      }
      const fires = Array.from(byEvent.values()).map((f) =>
        `<div class="fire">${esc(f.platform)} · ${esc(f.name)} — browser ${f.browser ? statusHtml(f.browser.status) : '<span class="st st-crit">✕</span>none'}, server ${f.server ? statusHtml(f.server.status) : '<span class="st st-none">–</span>none'}${f.server && f.server.error ? ` <span class="crit">(${esc(f.server.error)})</span>` : ''}</div>`).join('');
      return `<tr><td class="mono" style="white-space:nowrap">${esc(new Date(a.createdAt).toLocaleString())}</td>
        <td>${esc(LOGICAL[a.logicalEvent] ? LOGICAL[a.logicalEvent].noun : a.logicalEvent)}</td>
        <td class="mono">${esc(a.page)}</td><td>${esc(a.channel)}</td><td>${fires}</td></tr>`;
    }).join('') + '</tbody></table>';
}

function errorsTable() {
  if (!data.recentErrors.length) return '<div class="empty">✓ No server errors in this window.</div>';
  return `<table><thead><tr><th>When</th><th>Event</th><th>Page</th><th>Error</th></tr></thead><tbody>` +
    data.recentErrors.map((e) => `<tr><td class="mono" style="white-space:nowrap">${esc(new Date(e.createdAt).toLocaleString())}</td>
      <td>${esc(e.platform)} · ${esc(e.platformEvent)}</td><td class="mono">${esc(e.page)}</td><td class="crit">✕ ${esc(e.error)}</td></tr>`).join('') + '</tbody></table>';
}

function render() {
  if (!data.actions.length) {
    $('#app').innerHTML = '<div class="card"><div class="empty">No events in this window yet. Once the site is deployed with the tracker, buy clicks and quiz completions will show up here.</div></div>';
    return;
  }
  const { list, hourly } = buckets();
  $('#app').innerHTML = tiles() +
    `<section class="card"><h2>Over time</h2><p class="hint">Distinct actions per ${hourly ? 'hour' : 'day'}, in your local time.${includeBackfill && data.actions.some((a) => a.backfill) ? ' Lighter bars are backfilled history from Supabase: logged-in users only, and no pixel data.' : ''}</p>
      <div class="charts" id="charts"></div>
      <details><summary>Table view</summary><table><thead><tr><th>${hourly ? 'Hour' : 'Day'}</th><th class="num">Buy clicks</th><th class="num">Quiz completions</th></tr></thead><tbody>` +
      list.map((b) => `<tr><td>${esc(bucketLabel(b.t, hourly, true))}</td><td class="num">${fmt(b.buy_click + b.buy_click_bf)}${b.buy_click_bf ? ` <span style="color:var(--muted)">(${fmt(b.buy_click_bf)} backfilled)</span>` : ''}</td><td class="num">${fmt(b.quiz_complete + b.quiz_complete_bf)}${b.quiz_complete_bf ? ` <span style="color:var(--muted)">(${fmt(b.quiz_complete_bf)} backfilled)</span>` : ''}</td></tr>`).join('') +
    `</tbody></table></details></section>` +
    actionSection('buy_click') + actionSection('quiz_complete') +
    `<section class="card"><h2>Recent actions</h2><p class="hint">The newest ${data.recentActions.length}, every platform fire attached — click something on the site and find it here.</p>${recentTable()}</section>` +
    `<section class="card"><h2>Recent server errors</h2>${errorsTable()}</section>`;
  $('#charts').innerHTML = chart('buy_click', list, hourly) + chart('quiz_complete', list, hourly);
  wireTooltips(list, hourly);
}

$('#refresh').addEventListener('click', load);
$('#bf').addEventListener('change', (e) => { includeBackfill = e.target.checked; if (data) render(); });
$('#auto').addEventListener('change', (e) => {
  clearInterval(timer);
  if (e.target.checked) timer = setInterval(load, 60000);
});
renderWindows();
load();
</script>
</body>
</html>
